                    const cy = toRect.top + toRect.height / 2;

                    // Play sounds
                    if (result.moveType === 'castle_kingside' || result.moveType === 'castle_queenside') {
                        AudioSystem.playCastleSound();
                    } else if (result.isPromotion) {
                        AudioSystem.playPromotionSound();
                        ParticleSystem.spawnCaptureExplosion(cx, cy);
                    } else if (result.captured) {
                        AudioSystem.playCaptureSound();
                        ParticleSystem.spawnCaptureExplosion(cx, cy);
                    } else {
                        AudioSystem.playMoveSound();
                        ParticleSystem.spawn(cx, cy, 10, '#c8d8f0', 40, 600);
                    }

                    if (ChessEngine.kingInCheck) {
                        setTimeout(() => AudioSystem.playCheckSound(), 300);
                    }

                    // Animate piece movement
                    this.animatePieceMovement(fromRow, fromCol, toRow, toCol, result.captured);

                    // Re-render
                    setTimeout(() => {
                        this.renderPieces();
                        this.deselectAll();
                        this.updateAllUI();
                        if (ChessEngine.gameOver) {
                            this.showVictoryScreen();
                        }
                    }, result.captured ? 400 : 300);
                },

                animatePieceMovement(fromRow, fromCol, toRow, toCol, captured) {
                    const pieceEl = this.pieceElements[fromRow + ',' + fromCol];
                    const targetSquare = this.boardSquares[toRow][toCol];
                    if (!pieceEl || !targetSquare) return;

                    // Clone the piece for animation
                    const clone = pieceEl.cloneNode(true);
                    clone.style.position = 'fixed';
                    clone.style.zIndex = '20';
                    clone.style.pointerEvents = 'none';
                    clone.style.transition = 'all 0.35s cubic-bezier(0.25, 0.1, 0.25, 1.1)';
                    const fromRect = pieceEl.getBoundingClientRect();
                    const toRect = targetSquare.getBoundingClientRect();
                    clone.style.left = fromRect.left + 'px';
                    clone.style.top = fromRect.top + 'px';
                    clone.style.width = fromRect.width + 'px';
                    clone.style.height = fromRect.height + 'px';
                    clone.style.fontSize = getComputedStyle(pieceEl).fontSize;
                    clone.style.margin = '0';
                    document.body.appendChild(clone);

                    // Hide original
                    pieceEl.style.opacity = '0';

                    requestAnimationFrame(() => {
                        clone.style.left = toRect.left + 'px';
                        clone.style.top = toRect.top + 'px';
                        clone.style.width = toRect.width + 'px';
                        clone.style.height = toRect.height + 'px';
                    });

                    setTimeout(() => {
                        clone.remove();
                        pieceEl.style.opacity = '1';
                    }, 380);

                    // If capture, animate captured piece
                    if (captured) {
                        const capturedEl = this.pieceElements[toRow + ',' + toCol];
                        if (capturedEl) {
                            capturedEl.classList.add('capturing');
                            setTimeout(() => capturedEl.remove(), 500);
                        }
                    }
                },

                showPromotionModal(color) {
                    const overlay = document.getElementById('promotionOverlay');
                    const optionsContainer = document.getElementById('promotionOptions');
                    overlay.classList.remove('hidden');
                    optionsContainer.innerHTML = '';
                    const pieceTypes = ['q', 'r', 'b', 'n'];
                    const pieceSymbols = { q: '♕', r: '♖', b: '♗', n: '♘' };
                    const pieceNames = { q: 'Queen', r: 'Rook', b: 'Bishop', n: 'Knight' };
                    const prefix = color === 'white' ? 'w' : 'b';
                    const pieceClass = color === 'white' ? 'white-piece' : 'black-piece';

                    for (const type of pieceTypes) {
                        const btn = document.createElement('button');
                        btn.className = 'promo-piece-btn ' + pieceClass;
                        btn.textContent = pieceSymbols[type];
                        btn.title = pieceNames[type];
                        btn.addEventListener('click', () => {
                            overlay.classList.add('hidden');
                            const pending = ChessEngine.pendingPromotion;
                            if (pending) {
                                this.finishMove(pending.fromRow, pending.fromCol, pending.toRow, pending.toCol, pending
                                    .moveType, type);
                            }
                        });
                        optionsContainer.appendChild(btn);
                    }
                },

                showVictoryScreen() {
                    const overlay = document.getElementById('victoryOverlay');
                    const text = document.getElementById('victoryText');
                    const subtitle = document.getElementById('victorySubtitle');
                    overlay.classList.remove('hidden');
                    if (ChessEngine.gameResult === 'white_wins') {
                        text.textContent = '🏆 White Army Triumphs!';
                        subtitle.textContent = 'The Silver Legion claims victory!';
                    } else if (ChessEngine.gameResult === 'black_wins') {
                        text.textContent = '🏆 Black Army Triumphs!';
                        subtitle.textContent = 'The Obsidian Horde claims victory!';
                    } else {
                        text.textContent = '🤝 Stalemate';
                        subtitle.textContent = 'The battle ends in a draw.';
                    }
                    // Victory particles
                    const boardRect = document.getElementById('boardWrapper').getBoundingClientRect();
                    const cx = boardRect.left + boardRect.width / 2;
                    const cy = boardRect.top + boardRect.height / 2;
                    for (let i = 0; i < 5; i++) {
                        setTimeout(() => {
                            ParticleSystem.spawn(cx + (Math.random() - 0.5) * 200, cy + (Math.random() - 0.5) * 200,
                                25, '#ffe880', 120, 1200);
                        }, i * 200);
                    }
                },

                updateAllUI() {
                    this.updateTurnIndicator();
                    this.updateCapturedPieces();
                    this.updateMoveHistory();
                    this.clearHighlights();
                    this.highlightLastMove();
                    this.highlightKingInCheck();
                },

                updateTurnIndicator() {
                    const ti1 = document.getElementById('turnIndicator');
                    const ti2 = document.getElementById('turnIndicator2');
                    ti1.classList.remove('white-turn', 'black-turn', 'check-warning');
                    ti2.classList.remove('white-turn', 'black-turn', 'check-warning');
                    if (ChessEngine.gameOver) {
                        ti1.textContent = '🏁 Game Over';
                        ti2.textContent = '🏁 Game Over';
                        ti1.style.opacity = '0.7';
                        ti2.style.opacity = '0.7';
                        return;
                    }
                    ti1.style.opacity = '1';
                    ti2.style.opacity = '1';
                    if (ChessEngine.currentTurn === 'white') {
                        ti1.textContent = '⚪ White\'s Turn';
                        ti1.classList.add('white-turn');
                        ti2.textContent = '⚫ Black Waiting';
                        ti2.style.opacity = '0.5';
                        if (ChessEngine.kingInCheck === 'white') ti1.classList.add('check-warning');
                    } else {
                        ti2.textContent = '⚫ Black\'s Turn';
                        ti2.classList.add('black-turn');
                        ti2.style.opacity = '1';
                        ti1.textContent = '⚪ White Waiting';
                        ti1.style.opacity = '0.5';
                        if (ChessEngine.kingInCheck === 'black') ti2.classList.add('check-warning');
                    }
                },

                updateCapturedPieces() {
                    const whiteCapEl = document.getElementById('capturedByWhite');
                    const blackCapEl = document.getElementById('capturedByBlack');
                    const whiteCaptured = ChessEngine.capturedByWhite;
                    const blackCaptured = ChessEngine.capturedByBlack;
                    whiteCapEl.innerHTML = whiteCaptured.length === 0 ? '—' :
                        whiteCaptured.map(p => '<span class="captured-piece-icon">' + this.getPieceUnicode(p) +
                            '</span>').join('');
                    blackCapEl.innerHTML = blackCaptured.length === 0 ? '—' :
                        blackCaptured.map(p => '<span class="captured-piece-icon">' + this.getPieceUnicode(p) +
                            '</span>').join('');
                },

                updateMoveHistory() {
                    const listEl = document.getElementById('moveHistoryList');
                    if (ChessEngine.moveHistory.length === 0) {
                        listEl.innerHTML = '<span style="color:#7a6a50;">Awaiting battle...</span>';
                        return;
                    }
                    let html = '';
                    for (let i = 0; i < ChessEngine.moveHistory.length; i++) {
                        const moveNum = Math.floor(i / 2) + 1;
                        if (i % 2 === 0) html += `<span style="color:#9a8a60;">${moveNum}.</span> `;
                        html +=
                            `<span class="move-entry">${ChessEngine.getMoveNotation(ChessEngine.moveHistory[i])}</span> `;
                    }
                    listEl.innerHTML = html;
                    listEl.scrollTop = listEl.scrollHeight;
                },
            };

            // ==================== GLOBAL FUNCTIONS ====================
            window.restartGame = function() {
                document.getElementById('victoryOverlay').classList.add('hidden');
                document.getElementById('promotionOverlay').classList.add('hidden');
                ChessEngine.reset();
                UIController.deselectAll();
                UIController.renderPieces();
                UIController.updateAllUI();
                AudioSystem.resume();
            };

            window.undoMove = function() {
                if (ChessEngine.gameOver) return;
                if (ChessEngine.pendingPromotion) return;
                const success = ChessEngine.undoLastMove();
                if (success) {
                    UIController.deselectAll();
                    UIController.renderPieces();
                    UIController.updateAllUI();
                    AudioSystem.playMoveSound();
                }
            };

            window.toggleFullscreen = function() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen();
                }
            };

            window.setVolume = function(v) {
                AudioSystem.setVolume(v);
            };

            window.toggleMute = function() {
                const muted = AudioSystem.toggleMute();
                document.getElementById('muteBtn').textContent = muted ? 'Unmute' : 'Mute';
                document.getElementById('volumeSlider').value = muted ? 0 : AudioSystem.volume * 100;
            };

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'u' || e.key === 'U') {
                    if (!e.ctrlKey && !e.metaKey && document.activeElement === document.body) {
                        window.undoMove();
                    }
                }
                if (e.key === 'r' || e.key === 'R') {
                    if (!e.ctrlKey && !e.metaKey && document.activeElement === document.body) {
                        window.restartGame();
                    }
                }
                if (e.key === 'f' || e.key === 'F') {
                    if (!e.ctrlKey && !e.metaKey && document.activeElement === document.body) {
                        window.toggleFullscreen();
                    }
                }
            });

            // ==================== INITIALIZATION ====================
            function init() {
                AudioSystem.init();
                ChessEngine.reset();
                UIController.initBoard();
                UIController.updateAllUI();
                ParticleSystem.spawnAmbientParticles();
                // Initial ambient particles
                for (let i = 0; i < 6; i++) {
                    ParticleSystem.spawnAmbientParticleSingle();
                }
                // Click outside board to deselect
                document.addEventListener('click', function(e) {
                    const boardWrapper = document.getElementById('boardWrapper');
                    if (boardWrapper && !boardWrapper.contains(e.target) &&
                        !document.getElementById('promotionOverlay').contains(e.target) &&
                        !document.getElementById('victoryOverlay').contains(e.target)) {
                        UIController.deselectAll();
                    }
                });
                console.log('🧙‍♂️ Wizard Chess initialized! Two players, one epic battle.');
                console.log('   White (Silver Army) vs Black (Obsidian Army)');
                console.log('   Click a piece to see legal moves. Press U to undo, R to restart.');
            }

            // Start the game
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
